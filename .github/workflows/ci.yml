name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Vulnerability check
        # Informational, not a merge gate: govulncheck also flags CVEs in
        # the Go stdlib/toolchain itself, which trail Go patch releases by
        # design and aren't something a PR here can fix. A real dependency
        # vuln (in our direct/indirect module graph) should still be
        # noticed and bumped, just not block every PR until upstream ships
        # a patch.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found issues, see step output above"

      - name: Build
        run: make build
