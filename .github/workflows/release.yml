name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/krel_${GOOS}_${GOARCH}
          go build -trimpath -ldflags="-s -w" -o dist/krel_${GOOS}_${GOARCH}/kr ./cmd/kr
          go build -trimpath -ldflags="-s -w" -o dist/krel_${GOOS}_${GOARCH}/krel ./cmd/krel
          tar -C dist/krel_${GOOS}_${GOARCH} -czf dist/krel_${GOOS}_${GOARCH}.tar.gz kr krel

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/krel_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
